Categories:
  - Reading
License: AGPL-3.0-or-later
AuthorName: Raffael Mancini
SourceCode: https://github.com/sepi/hansi
IssueTracker: https://github.com/sepi/hansi/issues

AutoName: Hansi

RepoType: git
Repo: https://github.com/sepi/hansi.git

Builds:
  - versionName: 1.0.1
    versionCode: 2
    commit: d4334551698124ff87fbff5c3a2595b3f7aa7efa
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - windows
      - web
    prebuild:
      # The exact Flutter release is pinned in pubspec.yaml (environment:
      # flutter: X.Y.Z); check it out in the srclib.
      - flutterVersion=$(sed -n -E 's/^  flutter:[[:space:]]+([0-9.]+)$/\1/p' pubspec.yaml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      # DevTools add-ons bundled in some packages (shared_preferences,
      # provider): prebuilt web apps with wasm and fonts, never part of an
      # Android build.
      - rm -rf .pub-cache/hosted/pub.dev/*/extension/devtools
      # Generated from cedict.txt.gz; rebuilt from source in the build step.
      - rm assets/word_index.bin
      # Only used by tests.
      - rm assets/hanzi_freq.tsv.gz
    # Compressed dictionary data, not code; sources and licenses are listed
    # in docs/DATA.md.
    scanignore:
      - assets/cedict.txt.gz
      - assets/graphics.txt.gz
      - assets/mma_dict.txt.gz
      - assets/word_freq.tsv.gz
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/dart run tool/build_index.dart
      - $$flutter$$/bin/flutter build apk --release

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 1.0.1
CurrentVersionCode: 2
